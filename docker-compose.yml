services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vibe_market
      POSTGRES_USER: vibe_market
      POSTGRES_PASSWORD: vibe_market_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibe_market -d vibe_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/uploads:/app/uploads
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  build-worker:
    build: ./backend/builder
    env_file: ./backend/.env
    environment:
      BUILD_API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./backend/uploads/works:/app/uploads/works:ro
      - ./backend/uploads/trials:/app/uploads/trials
      - build_workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=512m
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  build_workspace:
