services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      AUTH_SECRET: ${AUTH_SECRET}
      SMS_MODE: ${SMS_MODE}
      LOCAL_SMS_CODE: ${LOCAL_SMS_CODE:-}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      BUILD_WORKER_TOKEN: ${BUILD_WORKER_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/app/uploads

  # 仅用于受限 Vite 前端 ZIP 的构建。它以非 root、只读根文件系统、
  # 内存/进程数限制运行，构建完成后只发布 dist 静态文件。
  build-worker:
    build: ./backend/builder
    restart: unless-stopped
    environment:
      BUILD_API_BASE: http://api:8000
      BUILD_WORKER_TOKEN: ${BUILD_WORKER_TOKEN}
    depends_on:
      api:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
      - build_workspace:/workspace
    read_only: true
    tmpfs:
      - /tmp:size=512m
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  uploads_data:
  build_workspace:
